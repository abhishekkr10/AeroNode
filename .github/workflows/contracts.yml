name: Evidence and device contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.5.3 -r requirements-phase4.txt
      - name: Verify integrity, failure handling and host-counter contracts
        run: python -m unittest tests.test_evidence.EvidenceContractTests tests.test_device.DeviceStateTests -v
